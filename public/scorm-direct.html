<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Permissive Content Security Policy to allow all content -->
  <meta http-equiv="Content-Security-Policy" content="default-src * 'self' 'unsafe-inline' 'unsafe-eval' data: blob: https:; script-src * 'self' 'unsafe-inline' 'unsafe-eval'; style-src * 'self' 'unsafe-inline';">
  <title>Direct SCORM Viewer</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      height: 100%;
    }
    .container {
      padding: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }
    h1 {
      color: #333;
      border-bottom: 1px solid #eee;
      padding-bottom: 10px;
    }
    .content-container {
      display: flex;
      gap: 20px;
    }
    .controls {
      width: 300px;
      flex-shrink: 0;
    }
    .iframe-container {
      flex-grow: 1;
      height: 700px;
      border: 1px solid #ddd;
      border-radius: 4px;
      overflow: hidden;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    button {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      background-color: #4299e1;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      text-align: left;
      font-size: 14px;
    }
    button:hover {
      background-color: #3182ce;
    }
    .current-path {
      margin: 10px 0;
      padding: 10px;
      background-color: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 4px;
      font-family: monospace;
      word-break: break-all;
    }
    .console {
      margin-top: 20px;
      padding: 10px;
      background-color: #1a202c;
      color: #e2e8f0;
      border-radius: 4px;
      font-family: monospace;
      height: 200px;
      overflow: auto;
    }
    .error {
      color: #fc8181;
    }
    .success {
      color: #68d391;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Direct SCORM Viewer</h1>
    <p>This page directly loads SCORM content with permissive settings to bypass security restrictions.</p>
    
    <div class="content-container">
      <div class="controls">
        <h3>Click to load content:</h3>
        <button onclick="loadContent('/Scorm/1/training.htm')">Load from /Scorm/1/training.htm</button>
        <button onclick="loadContent('/Scorm/1/index.html')">Load from /Scorm/1/index.html</button>
        <button onclick="loadContent('/Scorm/1/script.html')">Load from /Scorm/1/script.html</button>
        <button onclick="createInlineFrame()">Create Direct Inline Frame</button>
        <button onclick="openInNewTab('/Scorm/1/training.htm')">Open in New Tab</button>
        
        <div class="current-path" id="current-path">No content loaded yet</div>
        
        <div class="console" id="console">
          <div>Console output will appear here...</div>
        </div>
      </div>
      
      <div class="iframe-container" id="iframe-container">
        <iframe id="content-frame" src="about:blank" 
          allow="accelerometer; autoplay; camera; encrypted-media; fullscreen; geolocation; gyroscope; microphone; midi; payment; picture-in-picture; usb; xr-spatial-tracking" 
          sandbox="allow-downloads allow-forms allow-modals allow-orientation-lock allow-pointer-lock allow-popups allow-popups-to-escape-sandbox allow-presentation allow-same-origin allow-scripts"
          allowfullscreen></iframe>
      </div>
    </div>
  </div>

  <script>
    const consoleEl = document.getElementById('console');
    const pathEl = document.getElementById('current-path');
    
    function log(message, type = '') {
      const div = document.createElement('div');
      div.textContent = message;
      div.className = type;
      consoleEl.appendChild(div);
      consoleEl.scrollTop = consoleEl.scrollHeight;
    }
    
    function loadContent(path) {
      try {
        const iframe = document.getElementById('content-frame');
        pathEl.textContent = 'Loading: ' + path;
        log('Attempting to load: ' + path);
        
        iframe.onload = function() {
          log('Content loaded successfully!', 'success');
        };
        
        iframe.onerror = function(e) {
          log('Error loading content: ' + e.message, 'error');
        };
        
        iframe.src = path;
      } catch (error) {
        log('Exception: ' + error.message, 'error');
      }
    }
    
    function createInlineFrame() {
      try {
        // Replace the iframe container with a direct embed
        const container = document.getElementById('iframe-container');
        container.innerHTML = '';
        
        const frame = document.createElement('iframe');
        frame.src = '/Scorm/1/training.htm';
        frame.style.width = '100%';
        frame.style.height = '100%';
        frame.style.border = 'none';
        frame.allow = 'accelerometer; autoplay; camera; encrypted-media; fullscreen; geolocation; gyroscope; microphone; midi; payment; picture-in-picture; usb; xr-spatial-tracking';
        frame.setAttribute('sandbox', 'allow-downloads allow-forms allow-modals allow-orientation-lock allow-pointer-lock allow-popups allow-popups-to-escape-sandbox allow-presentation allow-same-origin allow-scripts');
        frame.allowFullscreen = true;
        
        container.appendChild(frame);
        pathEl.textContent = 'Direct embed: /Scorm/1/training.htm';
        log('Created direct inline frame', 'success');
      } catch (error) {
        log('Exception creating frame: ' + error.message, 'error');
      }
    }
    
    function openInNewTab(path) {
      try {
        window.open(path, '_blank');
        log('Opened in new tab: ' + path, 'success');
      } catch (error) {
        log('Error opening new tab: ' + error.message, 'error');
      }
    }
    
    // Log startup
    log('Page loaded. Click a button to load SCORM content.', 'success');
  </script>
</body>
</html>
